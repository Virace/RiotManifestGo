name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        # UPX on Windows ARM64 or Darwin ARM64 usually has spotty support but we compile it anyway.
        # We can exclude windows arm64 as we usually don't need it.
        exclude:
          - goos: windows
            goarch: arm64
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          
      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl
        
      - name: Build Binary
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $commit = "${{ github.sha }}".Substring(0, 7)
          ./scripts/build.ps1 -Version $version -Commit $commit -Os ${{ matrix.goos }} -Arch ${{ matrix.goarch }}
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/*
          retention-days: 1

  smoke:
    name: Release Smoke Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Run Unit and Component Tests
        run: go test ./... -count=1

      - name: Initialize Fixture Cache
        shell: pwsh
        run: ./scripts/init-fixtures.ps1

      - name: Run Offline Fixture Tests
        run: go test -tags=fixtures ./pkg/rman -count=1

      - name: Download Linux AMD64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: binary-linux-amd64
          path: build

      - name: Run Live Download Smoke
        shell: pwsh
        run: |
          chmod +x ./build/manifest-cli-linux-amd64
          ./scripts/release-smoke.ps1 -BinaryPath ./build/manifest-cli-linux-amd64

  release:
    name: Create Release
    needs: [build, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Generate Release Notes
        run: |
          prev=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null || true)
          {
            echo "## 更新内容"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s (%h)' "$prev..${{ github.ref_name }}"
              echo
              echo "**完整变更**: [\`$prev...${{ github.ref_name }}\`](https://github.com/${{ github.repository }}/compare/$prev...${{ github.ref_name }})"
            else
              git log --no-merges --format='- %s (%h)' "${{ github.ref_name }}"
            fi
          } > release-notes.md

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
